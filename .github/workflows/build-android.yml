name: Build Astra Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android build platform
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found at $SDKMANAGER"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: mobile
        run: gradle assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: astra-android-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
