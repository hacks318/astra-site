services:
  ollama:
    image: ollama/ollama:latest
    platform: linux/arm64
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      PORT: "8080"
      OLLAMA_URL: http://ollama:11434
      ASTRA_MODEL: qwen2.5:3b
      ASTRA_RATE_LIMIT: "8"
    depends_on:
      - ollama
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ASTRA_API_DOMAIN: ${ASTRA_API_DOMAIN:?Set ASTRA_API_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  ollama_data:
  caddy_data:
  caddy_config:
