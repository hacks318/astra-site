services:
  ollama:
    image: ollama/ollama:latest
    platform: linux/arm64
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      ASTRA_PROVIDER: ${ASTRA_PROVIDER:-ollama}
      OLLAMA_URL: http://ollama:11434
      ASTRA_MODEL: ${ASTRA_MODEL:-qwen2.5:3b}
      ASTRA_RATE_LIMIT: "8"
      ASTRA_DATABASE_PATH: /home/node/astra-data/astra.sqlite
      ASTRA_SITE_DIR: /site
      ASTRA_WEB_ORIGINS: ${ASTRA_WEB_ORIGINS:-https://hacks318.github.io}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - ollama
    expose:
      - "8080"
    volumes:
      - astra_data:/home/node
      - ./site:/site:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ASTRA_API_DOMAIN: ${ASTRA_API_DOMAIN:?Set ASTRA_API_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  ollama_data:
  astra_data:
  caddy_data:
  caddy_config:
